# Falco-Talon trên WORKLOAD cluster - terminate pod trong namespace vuln-lab
# helm --kubeconfig capi-quickstart.kubeconfig upgrade --install falco-talon falcosecurity/falco-talon \
#   -n falco -f 06-runtime-security/falco-talon-values.yaml
# Kiểm tra log: "2 rule(s) has/have been successfully loaded"
replicaCount: 1
config:
  rulesOverride: |
    - action: Terminate Pod
      actionner: kubernetes:terminate
      parameters:
        ignore_daemonsets: true
        ignore_statefulsets: true
        grace_period_seconds: 0

    - rule: Terminal shell in container
      description: Terminate pod when a terminal shell is opened
      match:
        rules:
          - Terminal shell in container
          - A shell was spawned in a container with an attached terminal
        output_fields:
          - k8s.ns.name=vuln-lab
      actions:
        - action: Terminate Pod

    - rule: Read sensitive file untrusted
      description: Terminate pod when /etc/shadow is read
      match:
        rules:
          - Read sensitive file untrusted
        output_fields:
          - k8s.ns.name=vuln-lab
      actions:
        - action: Terminate Pod
