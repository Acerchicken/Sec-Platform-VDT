# Workload vi phạm mẫu (image cũ có CVE, privileged, root) - mục tiêu cho Trivy, Falco, Talon
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-workload
  namespace: vuln-lab
  labels: {app: vulnerable-workload}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vulnerable-workload}
  template:
    metadata:
      labels: {app: vulnerable-workload}
    spec:
      containers:
      - name: web
        image: nginx:1.14.2
        securityContext:
          privileged: true
          runAsUser: 0
