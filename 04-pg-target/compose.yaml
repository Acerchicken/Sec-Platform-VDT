# PostgreSQL target - nằm NGOÀI Workload cluster, cùng Docker network "kind"
# (network do kind tạo ở bước 01, nên chạy file này SAU khi tạo Admin cluster).
# Cố ý dùng bản cũ, không SSL, mật khẩu yếu để có finding.
#   docker compose -f 04-pg-target/compose.yaml up -d
#   export PG_TARGET_IP=$(docker inspect -f '{{(index .NetworkSettings.Networks "kind").IPAddress}}' pg-target)
services:
  pg-target:
    image: postgres:12
    container_name: pg-target
    environment:
      POSTGRES_PASSWORD: poc-weak-pass
    restart: unless-stopped
    networks: [kind]
networks:
  kind:
    external: true
