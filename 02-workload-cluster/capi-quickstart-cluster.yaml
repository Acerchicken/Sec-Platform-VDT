# Workload cluster (VKE) capi-quickstart - tương đương:
#   POD_CIDR='["10.243.0.0/16"]' clusterctl generate cluster capi-quickstart --flavor development \
#     --kubernetes-version v1.36.1 --control-plane-machine-count=1 --worker-machine-count=1
# Apply vào Admin cluster, rồi: clusterctl get kubeconfig capi-quickstart > capi-quickstart.kubeconfig
#
# Nhãn trên Cluster là công tắc cơ chế tự cài (CAAPH HelmChartProxy + ClusterResourceSet, xem workload/addons/):
#   security-baseline=enabled  Falco, Sidekick, Talon, Kyverno, namespace, NetworkPolicy, ClusterPolicy; vào lịch scan
#   lab-target=enabled         Deployment vulnerable-workload (mục tiêu lab) trong vuln-lab
#   cni=calico                 Calico VXLAN qua ClusterResourceSet vdt-calico. KHÔNG gắn cho cluster đã cài Calico tay
#                              (calico.yaml); cluster mới: gắn nhãn này, hoặc dùng `make provision NAME=...`
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: capi-quickstart
  namespace: default
  labels:
    security-baseline: enabled
    lab-target: enabled
    # cni: calico              # chỉ bật khi cluster chưa có CNI (xem ghi chú đầu file)
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
      - 10.243.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
      - 10.128.0.0/12
  topology:
    classRef:
      name: quick-start
    controlPlane:
      replicas: 1
    variables:
    - name: imageRepository
      value: ""
    - name: etcdImageTag
      value: ""
    - name: coreDNSImageTag
      value: ""
    - name: podSecurityStandard
      value:
        audit: restricted
        enabled: true
        enforce: baseline
        warn: restricted
    version: v1.36.1
    workers:
      machineDeployments:
      - class: default-worker
        name: md-0
        replicas: 1
