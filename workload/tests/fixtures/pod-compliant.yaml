apiVersion: v1
kind: Pod
metadata:
  name: pt-compliant
  labels: {app: policy-test}
spec:
  securityContext: {runAsNonRoot: true, runAsUser: 1000}
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
