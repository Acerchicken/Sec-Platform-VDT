# Thông tin PostgreSQL target cho db-scan Job (WORKLOAD cluster, ns security-scan).
# PGHOST được scan-orchestrator.sh ghi đè mỗi lần chạy bằng $PG_TARGET_IP (IP container có thể đổi sau resume).
apiVersion: v1
kind: ConfigMap
metadata:
  name: scan-target
  namespace: security-scan
data:
  PGHOST: "127.0.0.1"          # placeholder, orchestrator sẽ cập nhật
  PGUSER: postgres
  PGCONNECT_TIMEOUT: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-target-cred
  namespace: security-scan
type: Opaque
stringData:
  PGPASSWORD: poc-weak-pass     # khớp POSTGRES_PASSWORD trong 04-pg-target/compose.yaml
