# Loki single binary trên ADMIN cluster - gateway NodePort 31100 (Falcosidekick ở Workload push vào đây)
# helm repo add grafana https://grafana.github.io/helm-charts
# helm upgrade --install loki grafana/loki -n logging --create-namespace -f 05-admin-apps/loki/values.yaml
# Kiểm tra: curl -s http://$ADMIN_NODE_IP:31100/loki/api/v1/labels
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: {replication_factor: 1}
  storage: {type: filesystem}
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
singleBinary: {replicas: 1, persistence: {size: 10Gi}}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
gateway:
  service: {type: NodePort, nodePort: 31100}
