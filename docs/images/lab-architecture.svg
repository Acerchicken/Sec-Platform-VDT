<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Sơ đồ lab: laptop; VM Ubuntu chạy admin cluster kind (CAPI, CAPD, cert-manager, CAAPH, ClusterResourceSet, scan orchestrator, DefectDojo, Loki, Grafana) và workload cluster capi-quickstart (Calico, Kyverno, Trivy, kube-bench, Falco, Falcosidekick, Falco-Talon).">
  <style>
svg {
  --bg: #f6f7f9; --fg: #1b2230; --muted: #5a6577; --line: #b9c1cd; --panel: #ffffff;
  --frame-admin: #eef2f8; --frame-work: #f1f5f2;
  --policy: #0f8a5f; --policy-bg: #e3f4ec;
  --runtime: #b8630a; --runtime-bg: #fbf0e2;
  --scan: #2a62c9; --scan-bg: #e6eefb;
  
  --mono: ui-monospace, Consolas, monospace;
 font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { svg {
  --bg: #12161d; --fg: #e3e8f0; --muted: #98a3b5; --line: #3d4757; --panel: #1a2029;
  --frame-admin: #161c26; --frame-work: #151c19;
  --policy: #3ccf95; --policy-bg: #12301f;
  --runtime: #f0a050; --runtime-bg: #33230f;
  --scan: #7aa7ff; --scan-bg: #16233d; color-scheme: dark } }
.bg { fill: var(--bg); }
/* SVG roles */
.vm { fill: none; stroke: var(--fg); stroke-width: 1.4; }
.fa { fill: var(--frame-admin); stroke: var(--line); stroke-width: 1.2; }
.fw { fill: var(--frame-work); stroke: var(--line); stroke-width: 1.2; }
.bx { fill: var(--panel); stroke: var(--line); }
.bx-p { fill: var(--policy-bg); stroke: var(--policy); stroke-width: 1.6; }
.bx-r { fill: var(--runtime-bg); stroke: var(--runtime); }
.bx-s { fill: var(--scan-bg); stroke: var(--scan); }
.sub { fill: var(--panel); stroke: var(--line); stroke-dasharray: 3 3; }
.sub-p { fill: var(--panel); stroke: var(--policy); }
.ns { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
.badge { fill: var(--policy); }
.badge-t { fill: var(--bg); font-size: 10px; font-weight: 600; letter-spacing: .06em; }
text { fill: var(--fg); font-size: 12px; }
.h { font-size: 15px; font-weight: 600; }
.ht { font-size: 13px; font-weight: 600; }
.m { fill: var(--muted); font-size: 11px; }
.mono { font-family: var(--mono); font-size: 11.5px; }
.tp { fill: var(--policy); } .tr { fill: var(--runtime); } .ts { fill: var(--scan); }
.a { fill: none; stroke-width: 1.6; }
.a-g { stroke: var(--fg); } .a-p { stroke: var(--policy); } .a-r { stroke: var(--runtime); } .a-s { stroke: var(--scan); }
.a-d { stroke-dasharray: 5 4; }
.mk-g { fill: var(--fg); } .mk-p { fill: var(--policy); } .mk-r { fill: var(--runtime); } .mk-s { fill: var(--scan); }

.chip { fill: var(--panel); stroke: var(--line); }
.c { font-size: 13px; font-weight: 500; text-anchor: middle; }
.lb { fill: var(--muted); font-size: 12px; }
</style>
